name: Deploy Backend

on:
  push:
    branches: [main]
    paths: ['backend/**']

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: cartwise-backend
  REPOSITORY: cartwise

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: astral-sh/setup-uv@v4

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
        env:
          CARTWISE_ENV: production
          CARTWISE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CARTWISE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          docker build -t $IMAGE backend/
          docker push $IMAGE

      - name: Deploy to Cloud Run
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          gcloud run deploy ${{ env.SERVICE }} \
            --image $IMAGE \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 60 \
            --cpu-boost \
            --set-env-vars "CARTWISE_ENV=production"
